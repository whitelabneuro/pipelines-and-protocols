input: "/scratch/prj/bcn_whitema_rbp/[PROJECT_ID]/inputs/sample_metadata.csv"
contrasts: "/scratch/prj/bcn_whitema_rbp/[PROJECT_ID]/inputs/contrasts.initial.csv"

matrix: "/scratch/prj/bcn_whitema_rbp/[PROJECT_ID]/quantification/salmon.merged.gene_counts.tsv"
transcript_length_matrix: "/scratch/prj/bcn_whitema_rbp/[PROJECT_ID]/quantification/salmon.merged.gene_lengths.tsv"

gtf: "[PATH_TO_SCRATCH_LOCAL_GTF]"

study_name: "[STUDY_ID]"

# Matrix and identifier handling
observations_id_col: "sample"
features_id_col: "gene_id"
features_name_col: "gene_name"
features_metadata_cols: "gene_id,gene_name,gene_biotype"

# RNA-seq workflow settings
study_type: "rnaseq"

# Reporting and interactive outputs
shinyngs_build_app: true

# Initial run: no pathway layer yet
gsea_run: false
gprofiler2_run: false

# Notes
# This template uses the White Lab preferred default of raw gene counts
# together with transcript lengths.
#
# Output directory creation is handled by the launch script and passed at run time
# via --outdir.
#
# For the CREATE-native launch pattern used here, project paths in this params file
# should be absolute scratch-accessible paths rather than relative paths.
