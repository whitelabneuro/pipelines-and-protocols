# White Lab reference preset for g:Profiler GO-oriented extension runs

gsea_run: false

gprofiler2_run: true
gprofiler2_organism: "[GPROFILER_ORGANISM]"

# Optional background behaviour examples:
# gprofiler2_background_file: "inputs/gene_sets/[BACKGROUND_FILENAME].txt"
# gprofiler2_background_file: false

# Optional note:
# This preset is intended to be combined with a study-specific params file
# that already defines the matrix, metadata, contrasts, annotation source,
# study_name, and outdir.
